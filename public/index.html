      const baseUrl = window.REACT_APP_BASE_URL = '%REACT_APP_BASE_URL%';
         
      document.querySelectorAll('aaaaa').forEach((element) => {
          let srcOrHref = element.tagName === 'LINK' ? 'href' : 'src';
          let url = element.getAttribute(srcOrHref);

          if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
              element.setAttribute(srcOrHref, baseUrl + url);
          }
      });
